name: Build SM-M127F KernelSU (physwizz base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git make bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          python3 zip unzip ccache

    - name: Download Android Clang r353983c
      run: |
        mkdir -p $HOME/toolchains
        git clone --depth=1 \
          https://github.com/droidian/android-platform-prebuilts-clang-host-linux-x86-29.git \
          $HOME/toolchains/clang-r353983c 2>&1 | tail -3
        CLANG_BIN=$(find $HOME/toolchains/clang-r353983c -name clang -type f -exec dirname {} \; | head -1)
        echo "CLANG_PATH=$CLANG_BIN" >> $GITHUB_ENV
        $CLANG_BIN/clang --version

    - name: Clone physwizz kernel source
      run: |
        git clone --depth=1 \
          https://github.com/physwizz/a127f-R-u1.git \
          kernel
        echo "=== Available defconfigs ==="
        ls kernel/arch/arm64/configs/ | grep -i "a12\|m12\|exynos"
        head -5 kernel/Makefile

    - name: Apply KernelSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        echo "KernelSU done"

    - name: Fix source errors
      run: |
        cd kernel
        # Fix drivers/gpu/arm/Kconfig - syntax errors block defconfig
        echo "# empty" > drivers/gpu/arm/Kconfig        # Fix vision/npu Kconfig encoding
        echo "aW1wb3J0IHN5cwpkYXRhPW9wZW4oc3lzLmFyZ3ZbMV0sJ3JiJykucmVhZCgpCm9wZW4oc3lzLmFyZ3ZbMV0sJ3diJykud3JpdGUoYnl0ZXMoYiBmb3IgYiBpbiBkYXRhIGlmIGI+PTMyIG9yIGIgaW4oOSwxMCwxMykpKQo=" | base64 -d > /tmp/fix_enc.py
        for f in drivers/vision/npu/Kconfig; do
          [ -f "$f" ] && python3 /tmp/fix_enc.py "$f" || true
        done
        # Fix process.c - secdbg_exin_get_unfz not available in OSS build
        sed -i 's/panic("fail to freeze tasks: %s", secdbg_exin_get_unfz());/panic("fail to freeze tasks");/' kernel/power/process.c
        # Fix unused variable if present (different repos have different code)
        sed -i '/^\s*enum sys_states sys_state;/d' kernel/power/process.c
        sed -i '/^\s*sys_state = PM_/d' kernel/power/process.c
        # Fix fs/super.c - F2FS_SUPER_MAGIC not defined
        sed -i 's/F2FS_SUPER_MAGIC/0xF2F52010UL/g' fs/super.c
        echo "Source fixes applied"

    - name: Configure kernel
      run: |
        cd kernel
        DEFCONF=$(ls arch/arm64/configs/ | grep -i "a12\|m12nacho\|exynos3830" | head -1)
        [ -z "$DEFCONF" ] && DEFCONF=$(ls arch/arm64/configs/ | grep -i "exynos" | head -1)
        echo "Using defconfig: $DEFCONF"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang $DEFCONF
        scripts/config --enable  CONFIG_MODULES
        scripts/config --enable  CONFIG_MODULE_UNLOAD
        scripts/config --enable  CONFIG_KPROBES
        scripts/config --enable  CONFIG_HAVE_KPROBES
        scripts/config --enable  CONFIG_KPROBE_EVENTS
        scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
        scripts/config --disable CONFIG_SEC_RESTRICT_ROOTING
        scripts/config --disable CONFIG_TIMA_RKP
        scripts/config --disable CONFIG_RKP_KDP
        scripts/config --disable CONFIG_PROCA
        scripts/config --disable CONFIG_DEFEX
        scripts/config --disable CONFIG_UH
        scripts/config --disable CONFIG_INTEGRITY
        scripts/config --disable CONFIG_FIVE
        scripts/config --disable CONFIG_RANDOMIZE_BASE
        scripts/config --set-str CONFIG_CMDLINE "androidboot.warranty_bit=0 androidboot.bootlock=0 androidboot.selinux=permissive enforcing=0 androidboot.veritymode=disabled androidboot.secureboot=0 androidboot.force_secureboot=0 nokaslr"
        scripts/config --enable  CONFIG_CMDLINE_EXTEND
        scripts/config --disable CONFIG_SYSTEM_TRUSTED_KEYS        2>/dev/null || true
        scripts/config --disable CONFIG_SYSTEM_REVOCATION_KEYS     2>/dev/null || true
        scripts/config --disable CONFIG_MODULE_SIG                 2>/dev/null || true
        scripts/config --disable CONFIG_MODULE_SIG_ALL             2>/dev/null || true
        scripts/config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""     2>/dev/null || true
        scripts/config --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""  2>/dev/null || true
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang \
          CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 \
          AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld olddefconfig
        grep "CONFIG_KSU\|CONFIG_KPROBES\b\|CONFIG_MODULES\b" .config

    - name: Build kernel
      run: |
        cd kernel
        # Fix extract-cert.c and dtc issues
        echo "" | base64 -d | bash
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          CC=${{ env.CLANG_PATH }}/clang CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld \
          Image 2>&1 | tee /tmp/build.log | grep -E "^.*error:" | head -20 || true
        echo "=== BUILD ERRORS ===" && grep "error:" /tmp/build.log | grep -v "^#\|objdump\|DWARF" | head -20 || true
        ls -la arch/arm64/boot/Image || { echo "Image NOT created"; cat /tmp/build.log | tail -30; exit 1; }
        strings arch/arm64/boot/Image | grep "Linux version"

    - name: Package kernel
      run: |
        ls -la kernel/arch/arm64/boot/Image
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
        cp kernel/arch/arm64/boot/Image anykernel/
        echo "" | base64 -d > anykernel/anykernel.sh
        cd anykernel && zip -r9 ../SM-M127F_KernelSU.zip * -x "*.zip"
        ls -la ../SM-M127F_KernelSU.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SM-M127F_KernelSU
        path: SM-M127F_KernelSU.zip
