name: Build SM-M127F KernelSU (physwizz base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          git make bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          python3 zip unzip ccache

    - name: Download Android Clang r353983c
      run: |
        mkdir -p $HOME/toolchains
        git clone --depth=1 \
          https://github.com/droidian/android-platform-prebuilts-clang-host-linux-x86-29.git \
          $HOME/toolchains/clang-r353983c 2>&1 | tail -3
        CLANG_BIN=$(find $HOME/toolchains/clang-r353983c -name clang -type f -exec dirname {} \; | head -1)
        echo "CLANG_PATH=$CLANG_BIN" >> $GITHUB_ENV
        $CLANG_BIN/clang --version

    - name: Clone SpacingBat3 kernel (physwizz source)
      run: |
        # Try multiple sources for exynos850 kernel
        git clone --depth=1           https://github.com/theshoqanebi/android_samsung_m12_kernel.git           --branch android-11-m12 kernel 2>/dev/null ||         git clone --depth=1           https://github.com/edikdruzinin-blip/android_samsung_m12_kernel.git           --branch main kernel 2>/dev/null ||         git clone --depth=1           https://github.com/exynos850-dev/android_kernel_samsung_exynos850.git           kernel 2>/dev/null || true
        echo "Kernel source:"
        ls kernel/arch/arm64/configs/ | grep -i "m12\|exynos850" 2>/dev/null || echo "No configs found"

    - name: Apply KernelSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

    - name: Configure kernel
      run: |
        cd kernel
        # Download working defconfig from theshoqanebi (physwizz source)
        DEFCONF_URL="https://raw.githubusercontent.com/theshoqanebi/android_samsung_m12_kernel/android-11-m12/arch/arm64/configs/exynos3830-m12nacho_defconfig"
        wget -q "$DEFCONF_URL" -O arch/arm64/configs/exynos3830-m12nacho_defconfig 2>/dev/null || true
        if [ -s arch/arm64/configs/exynos3830-m12nacho_defconfig ]; then
          DEFCONF=exynos3830-m12nacho_defconfig
          echo "Downloaded defconfig: $DEFCONF"
        else
          DEFCONF=$(ls arch/arm64/configs/ | grep -i "m12\|exynos3830" | head -1)
          echo "Using local defconfig: $DEFCONF"
        fi
        # Fix build errors
        echo "" | base64 -d | python3
        echo "=== Using: $DEFCONF ==="
        echo "" | base64 -d | bash
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang $DEFCONF
        scripts/config --enable  CONFIG_MODULES
        scripts/config --enable  CONFIG_MODULE_UNLOAD
        scripts/config --enable  CONFIG_KPROBES
        scripts/config --enable  CONFIG_HAVE_KPROBES
        scripts/config --enable  CONFIG_KPROBE_EVENTS
        scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
        scripts/config --disable CONFIG_SEC_RESTRICT_ROOTING
        scripts/config --disable CONFIG_TIMA_RKP
        scripts/config --disable CONFIG_RKP_KDP
        scripts/config --disable CONFIG_PROCA
        scripts/config --disable CONFIG_DEFEX
        scripts/config --disable CONFIG_UH
        scripts/config --disable CONFIG_INTEGRITY
        scripts/config --disable CONFIG_FIVE
        scripts/config --disable CONFIG_RANDOMIZE_BASE
        scripts/config --set-str CONFIG_CMDLINE "androidboot.warranty_bit=0 androidboot.bootlock=0 androidboot.selinux=permissive enforcing=0 androidboot.veritymode=disabled androidboot.secureboot=0 androidboot.force_secureboot=0 nokaslr"
        scripts/config --enable CONFIG_CMDLINE_EXTEND
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld olddefconfig
        grep "CONFIG_KSU\|CONFIG_KPROBES\b\|CONFIG_MODULES\b" .config

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          CC=${{ env.CLANG_PATH }}/clang CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld \
          Image 2>&1 | tee /tmp/build.log | grep -E "error:|Error" | head -30 || true
        echo "=== BUILD ERRORS ===" && grep "error:" /tmp/build.log | grep -v "^#\|objdump\|DWARF" | head -20 || true
        echo "=== LINKER ERRORS ===" && grep "undefined reference" /tmp/build.log | sort -u | head -20 || true
        ls -la arch/arm64/boot/Image || echo "Image NOT created - build failed"

    - name: Package kernel
      run: |
        ls -la arch/arm64/boot/Image 2>/dev/null || { echo "No Image - build failed"; exit 1; }
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
        cp kernel/arch/arm64/boot/Image anykernel/
        echo "" | base64 -d > anykernel/anykernel.sh
        cd anykernel && zip -r9 ../SM-M127F_KernelSU.zip * -x "*.zip"
        ls -la ../SM-M127F_KernelSU.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SM-M127F_KernelSU
        path: SM-M127F_KernelSU.zip
